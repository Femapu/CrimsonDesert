; QuattroStagioni - KIT DI TEST (solo per lo sviluppo, non per i giocatori).
; Giro di probe delle funzioni finali: fulmini, luce, durata del giorno, particelle.
; Uso: a gioco chiuso copiare questo file al posto di bin64\scripts\QuattroStagioni\probes.ini
; (tenere da parte l'originale), giocare, poi rimettere l'originale. Output in
; bin64\scripts\QuattroStagioni\probe.log. Guida: docs/dev/probe_funzioni_finali.md.
; Sola lettura (AllowHooks=0): non scrive nulla nel gioco. Servono la mod e il meteo avviati.
; Sono accese solo le probe dei blocchi meteo/atmosfera e gli elenchi di classi; quelle dei giri
; vecchi (orologio, cvar, simulatori meteo) qui non ci sono.

[General]
Enabled=1
StartDelayMs=30000
IntervalMs=500
AllowHooks=0
MaxLogMB=256
SummarySec=60
LogSections=0
ExpectTimestamp=0x6AE58024

; ================================================================ funzioni finali (31/10)
; Blocchi composti dal gioco a ogni tick, presi dal modulo meteo (Provider=climate_manager, nessun
; hook in piu': serve solo che il meteo sia avviato, anche con [Weather] Enabled=0). Sola lettura.
; Uso e lettura del probe.log: docs/dev/probe_funzioni_finali.md. Instance=provided accetta Chain=
; (p = *(p+off) per ogni elemento), Dump, Watch, Stats come le altre probe.
;   Provider=climate_manager   l'oggetto climate manager visto dall'hook del meteo
[probe.layer_atmosphere]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x28
Dump=0:0x400
Stats=1
StatsRanges=0:1, -1:1, 0:24, 0:100000
Watch=0xAC:f32:cloudCover
IntervalMs=1000

; Seconda parte dell'atmosfera (se il blocco continua oltre 0x400): colori e intensità di sole,
; ambiente e cielo, densità della nebbia (docs/dev/luce.md). Righe Watch= da aggiungere a mano sui
; float candidati trovati nel Dump (es. Watch=0x1A0:f32:sunR, 0x1A4:f32:sunG, 0x1A8:f32:sunB).
[probe.layer_atmosphere_tail]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x28
Dump=0x400:0x400
Stats=1
StatsRanges=0:1, 0:10, 0:100000
IntervalMs=1000

[probe.layer_weather]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x20
Dump=0:0x400
Stats=1
StatsRanges=0:1, -1:1
Watch=0x12C:f32:precip, 0x130:f32:cloud, 0x16C:f32:snow, 0x170:f32:rain
IntervalMs=500

; La tabella dei livelli: i puntatori agli altri livelli (fulmini, effetti) stanno qui.
[probe.layer_table]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60
Dump=0:0x100
IntervalMs=2000

; Il climate manager stesso (primi 0x400 byte; l'ora del gioco si legge dalla riga Watch del meteo).
[probe.climate_manager]
Enabled=1
Provider=climate_manager
Instance=provided
Dump=0:0x400
IntervalMs=2000

[probe.list_lightning]
Enabled=1
ListClasses=*Lightning*
[probe.list_thunder]
Enabled=1
ListClasses=*Thunder*
[probe.list_atmosphere]
Enabled=1
ListClasses=*Atmosphere*
[probe.list_sky]
Enabled=1
ListClasses=*Sky*
[probe.list_light]
Enabled=1
ListClasses=*Light*
[probe.list_fog]
Enabled=1
ListClasses=*Fog*
[probe.list_particle]
Enabled=1
ListClasses=*Particle*
[probe.list_effect]
Enabled=1
ListClasses=*Effect*
[probe.list_leaf]
Enabled=1
ListClasses=*Leaf*

; ---------------------------------------------------------------- fulmini (docs/dev/fulmini.md)
; Campionamento veloce (100 ms) dei blocchi composti durante un temporale: un campo dei fulmini
; cambia solo a scatti, quando lampeggia. Accenderle insieme a layer_weather / layer_atmosphere /
; layer_table, provocare un temporale e cercare nel probe.log le dword che saltano e tornano.
[probe.lightning_atmosphere]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x28
Dump=0:0x800
Stats=1
StatsRanges=0:1, -1:1, 0:100000
IntervalMs=100

[probe.lightning_weather]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x20
Dump=0x170:0x690
Stats=1
StatsRanges=0:1, -1:1, 0:100000
IntervalMs=100

[probe.lightning_manager]
Enabled=1
Provider=climate_manager
Instance=provided
Dump=0:0x800
Stats=1
IntervalMs=100

; Altri livelli della tabella [mgr+0x60] (+0x30, +0x38, +0x40, +0x48): se layer_table mostra
; puntatori in questi slot, uno di loro potrebbe essere il livello dei fulmini o degli effetti.
[probe.layer_slot_30]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x30
Dump=0:0x400
IntervalMs=200
[probe.layer_slot_38]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x38
Dump=0:0x400
IntervalMs=200
[probe.layer_slot_40]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x40
Dump=0:0x400
IntervalMs=200
[probe.layer_slot_48]
Enabled=1
Provider=climate_manager
Instance=provided
Chain=0x60, 0x48
Dump=0:0x400
IntervalMs=200

; Particelle (docs/dev/particelle.md): classi del vento e della vegetazione, dove potrebbe stare
; la quantita' di foglie che cadono.
[probe.list_wind]
Enabled=1
ListClasses=*Wind*
[probe.list_foliage]
Enabled=1
ListClasses=*Foliage*
[probe.list_vegetation]
Enabled=1
ListClasses=*Vegetation*
