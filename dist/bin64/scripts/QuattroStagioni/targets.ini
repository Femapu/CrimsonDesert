; ================================================================ fulmini
; Letto dal modulo dei fulmini (src/win/apply/lightning_win.cpp), non dal season applier: vale anche
; con [General] Enabled=0. Scrive dopo la composizione del meteo (serve il modulo meteo avviato).
; Finché Field= è vuoto la logica gira lo stesso e scrive nel log le righe "lightning: strike ..."
; (utile per controllare le frequenze). Guida per trovare il campo: docs/dev/fulmini.md.
;   Enabled=0|1   spento di default
;   Field=        <livello>:<offset>[:<quanti f32>], livello weather | atmosphere | manager
;                 esempio: atmosphere:0x1A0 oppure weather:0x200:3
;   Mode=level    campo = gioco + (Value - gioco) * livello dei fulmini (0..1, graduale)
;   Mode=pulse    campo = Value per PulseMs a ogni lampo, poi di nuovo il valore del gioco
;   Value=        valore da scrivere (f32)
; Niente Restore: il gioco ricompone i livelli a ogni tick. Il tuono resta quello del gioco.
[lightning]
Enabled=0
Field=
Mode=pulse
Value=1

; ================================================================ luce e cielo stagionali (funzioni finali)
; [lighting]  campi del gioco su cui la mod applica i moltiplicatori di [Lighting] (QuattroStagioni.ini).
; Indipendente da [General] qui sopra: legge i blocchi che il gioco ricompone a ogni tick, presi dal
; modulo meteo (serve che il meteo sia avviato, anche con [Weather] Enabled=0). Ogni campo si scrive
; come <livello>:<offset>[:<numero di float>], livello weather | atmosphere | manager, per esempio
; SunColor=atmosphere:0x1A0:3 (tre float da +0x1A0, rosso verde blu; un quarto float viene lasciato com'è).
;   Enabled=0|1        spento finché gli offset non sono confermati con le probe (docs/dev/luce.md)
;   SunColor=          colore del sole (3 float)          SunIntensity=      intensità del sole (1 float)
;   AmbientColor=      colore della luce ambiente (3)     AmbientIntensity=  intensità della luce ambiente (1)
;   FogDensity=        densità della nebbia (1)           SkyColor=          colore del cielo (3)
;   <Chiave>Min= <Chiave>Max=   limiti di sicurezza del valore del gioco (default 0 e 100000): un valore
;                      fuori dai limiti, o non finito, spegne la luce stagionale e rimette l'originale.
; Se un campo non viene ricomposto dal gioco a ogni tick (la mod rilegge il proprio valore) la luce si
; spegne da sola: "lighting: DISABLED: ... non ricomposto dal gioco" nel log. Campo vuoto = non usato.
[lighting]
Enabled=0
SunColor=
SunIntensity=
AmbientColor=
AmbientIntensity=
FogDensity=
SkyColor=
