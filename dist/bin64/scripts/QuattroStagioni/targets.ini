; QuattroStagioni - applicazione delle stagioni al gioco (meteo, neve, luce, durata del giorno, particelle).
; Letto da bin64\scripts\QuattroStagioni\targets.ini; messaggi in bin64\scripts\QuattroStagioni.log
; (prefisso "apply:"). Si compila con gli indirizzi trovati dalle probe, si rilancia il gioco: nessuna
; ricompilazione. Guida completa ed esempi: docs/dev/appliers.md. Piano delle probe: docs/recon/probe_plan.md.
;
; TUTTO E' SPENTO: [General] Enabled=0 e ogni target ha Enabled=0. Gli oggetti e gli offset qui sotto
; sono CANDIDATI presi da recon C e dal piano delle probe, NON verificati: accendere un target solo dopo
; averne confermato oggetto e offset con le probe (probe.log).
;
; [General]
;   Enabled=0|1          interruttore generale
;   StartDelayMs         attesa prima di cercare gli oggetti (lasciare finire avvio e caricamento)
;   IntervalMs           periodo di applicazione (100 = 10 volte al secondo)
;   ResolveRetryMs       ogni quanto si riprova a cercare un oggetto non trovato (o perso)
;   AnomalyLimit         anomalie consecutive (valore non scritto, riscritto dal gioco, illeggibile)
;                        dopo le quali un target si spegne da solo e rimette il valore originale
;   AllowHooks=0|1       serve solo per Instance=capture (scambio di uno slot vtable o MinHook guardato)
;   ExpectTimestamp      TimeDateStamp dell'exe per cui valgono gli Rva= (altrimenti ignorati)
;   LogLevel             1 normale, 2 scrive ogni valore cambiato
;   Region               regione del motore stagioni i cui valori si applicano (Temperate, NorthCold, ...)
;
; [Features]  interruttori per gruppo (valgono INSIEME a quelli del menu F5: meteo, neve, luce,
;             durata del giorno, particelle). Clock = lettura dell'orologio del gioco.
;
; [Weather]  sequenza meteo deterministica dai pesi stagionali (come StageInfo_Weather del gioco)
;   HoldHours     ore di gioco di ogni fascia meteo
;   BlendHours    sfumatura all'inizio della fascia dal meteo precedente
;   Persistence   probabilità di tenere il meteo precedente (fasce più lunghe)
;   Seed          seme della sequenza
;   Flag<Stato>   bit WeatherState per weather_state_flags (Sunny Cloudy Rainy Storm Snowy Windy)
;   Index<Stato>  valore per weather_index (default: ordine dell'enum nell'exe)
;
; [object.<nome>]  come trovare un oggetto del gioco
;   Class=pa::X                      classe RTTI (robusta alle patch); per scan/capture è obbligatoria
;   Instance=scan|global|capture
;     scan     cerca nell'heap gli oggetti con la vtable della classe
;     global   Signature= (+SigOffset, Resolve=rip:<disp>:<len>) oppure Rva= (solo con ExpectTimestamp),
;              poi Chain=off1,off2 (p = *(p+off) per ogni elemento); senza Chain l'indirizzo risolto è
;              l'oggetto stesso (una struttura globale nei dati dell'exe)
;     capture  Hook=vtable con Class+Slot, oppure Hook=minhook su Class+Slot, Signature o Rva;
;              registra `this` (CaptureArg=rcx|rdx); l'hook viene tolto appena trovato (KeepHook=0)
;   Multiple=refuse|first|all  MaxInstances   con più candidati: rifiuta (default), il primo, tutti
;   Check=0x10:f32:0:24, ...  campi che devono essere plausibili perché un candidato sia accettato
;   CheckVtable=1   l'oggetto si considera perso se il suo puntatore vtable cambia (default)
;
; [target.<nome>]  un campo DATI di un oggetto
;   Enabled=0|1  Object=<nome>  Offset=0x..  Type=f32|f64|i32|u32|u8|flags32  Bit=n  Mask=0x..
;   Semantic=    hour minute day_counter (sola lettura)
;                time_scale_day time_scale_night time_scale_current
;                weather_manual_flag weather_state_flags weather_index weather_weight_<stato>
;                weather_mix_<stato> precipitation rain_amount snow_rate temperature_offset temperature
;                snow_amount sun_elevation_offset light_tint_r light_tint_g light_tint_b saturation
;                leaves_particles breath_visible
;   Mode=write|read|scale|offset
;     write   valore = v*Scale + Bias
;     scale   valore = originale * (1 + (v-1)*Scale)   (Scale = intensità, 1 = piena)
;     offset  valore = originale + v*Scale + Bias
;     read    solo lettura: v = (valore - Bias)/Scale
;   Min= Max=    limiti del valore finale (per read: intervallo plausibile)
;   MaxRate=     variazione massima per secondo reale (0 = nessun limite)
;   Tolerance=   tolleranza della rilettura (default automatico)
;   Restore=1    rimette l'originale all'uscita e quando la funzione viene spenta dal menu
;   Feature=     raramente serve: sposta il target in un altro gruppo

[General]
Enabled=0
StartDelayMs=30000
IntervalMs=100
ResolveRetryMs=5000
AnomalyLimit=5
AllowHooks=0
ExpectTimestamp=0x6AE387F2
LogLevel=1
Region=Temperate

[Features]
Weather=1
Snow=1
Light=1
DayLength=1
Particles=1
Clock=1

[Weather]
HoldHours=6
BlendHours=0.75
Persistence=0.35
Seed=0x5EA50
FlagSunny=0x20
FlagCloudy=0x10
FlagRainy=0x01
FlagStorm=0x08
FlagSnowy=0x02
FlagWindy=0x04

; ================================================================ oggetti (candidati)
; GameTime pubblicato, copia B (firma GameTimeGlobals_ref, la stessa di probe.clock_b):
; +0 day, +4 hour, +8 minute (u32). Struttura globale nei dati dell'exe: niente Chain, niente Class.
[object.gametime]
Instance=global
Signature=C5 FC 10 05 ?? ?? ?? ?? EB 08 C5 FC 10 05 ?? ?? ?? ?? 80 BB 7C 01 00 00
SigOffset=10
Resolve=rip:4:8
Check=0x4:u32:0:23, 0x8:u32:0:59

; PAWeatherManager: `this` di WeatherManager_Update (stessa firma di probe.weather_manager).
; Campi da recon C: +0x31 _isManualWeather (u8), +0x34 temperatura climatica, +0x44 temperatura corrente.
[object.weather_manager]
Instance=capture
Hook=minhook
Signature=48 8B C4 53 55 56 57 41 54 41 56 41 57 48 81 EC 90 00 00 00 C5 F8 29 70 B8 C5 F8 29 78 A8 C5 78
Multiple=first
MaxInstances=2
Check=0x34:f32:-80:80

; Stato meteo autoritativo (split client/server anche in single player).
[object.server_weather]
Class=pa::ServerWeatherManager
Instance=scan

; Simulazione del tempo del meteo: miglior candidato per le velocità giorno/notte (probe_plan 2.2).
[object.weather_time]
Class=pa::scriptComponent::weatherTimeSimulatorScriptComponent
Instance=scan

; Accumulo di neve e bagnato sulle superfici (probe_plan 2.4).
[object.surface]
Class=pa::scriptComponent::WeatherSurfaceSimulatorScriptComponent
Instance=scan

; WeatherConstant composto: luce, sole, neve (probe_plan 2.6). Da trovare con le probe: qui come scan
; di una classe ipotetica, da sostituire con il metodo trovato (capture o catena di puntatori).
[object.weather_constant]
Class=pa::WeatherConstant
Instance=scan

; Effetti meteo (particelle).
[object.weather_effect]
Class=pa::scriptComponent::WeatherEffectScriptComponent
Instance=scan

; ================================================================ orologio (sola lettura)
[target.clock_day]
Enabled=0
Object=gametime
Semantic=day_counter
Type=u32
Offset=0x0

[target.clock_hour]
Enabled=0
Object=gametime
Semantic=hour
Type=u32
Offset=0x4

[target.clock_minute]
Enabled=0
Object=gametime
Semantic=minute
Type=u32
Offset=0x8

; ================================================================ durata del giorno
; Offset DA TROVARE (probe_plan 2.2: float vicini a 1 che cambiano la velocità del HUD).
[target.time_scale_day]
Enabled=0
Object=weather_time
Semantic=time_scale_day
Type=f32
Offset=0x40
Min=0.25
Max=4
MaxRate=0.5

[target.time_scale_night]
Enabled=0
Object=weather_time
Semantic=time_scale_night
Type=f32
Offset=0x44
Min=0.25
Max=4
MaxRate=0.5

