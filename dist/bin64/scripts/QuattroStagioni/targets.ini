Object=weather_constant
Semantic=weather_mix_rainy
Type=f32
Offset=0x198
MaxRate=0.05

[target.precipitation]
Enabled=0
Object=weather_constant
Semantic=precipitation
Type=f32
Offset=0x190
MaxRate=0.05

[target.snow_rate]
Enabled=0
Object=weather_constant
Semantic=snow_rate
Type=f32
Offset=0x174
MaxRate=0.05

; Temperatura climatica: offset stagionale (negativo d'inverno) sommato all'originale, mai sotto -30.
[target.climate_temperature]
Enabled=0
Object=weather_manager
Semantic=temperature_offset
Mode=offset
Type=f32
