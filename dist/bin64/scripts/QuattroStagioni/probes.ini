; ---------------------------------------------------------------- fulmini (docs/dev/fulmini.md)
; Campionamento veloce (100 ms) dei blocchi composti durante un temporale: un campo dei fulmini
; cambia solo a scatti, quando lampeggia. Accenderle insieme a layer_weather / layer_atmosphere /
; layer_table, provocare un temporale e cercare nel probe.log le dword che saltano e tornano.
[probe.lightning_atmosphere]
Enabled=0
Provider=climate_manager
Instance=provided
Chain=0x60, 0x28
Dump=0:0x800
Stats=1
StatsRanges=0:1, -1:1, 0:100000
IntervalMs=100

[probe.lightning_weather]
