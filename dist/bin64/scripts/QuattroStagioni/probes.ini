; QuattroStagioni - probe runtime (sviluppo). Letto da bin64\scripts\QuattroStagioni\probes.ini,
; output in bin64\scripts\QuattroStagioni\probe.log. Si modifica, si rilancia il gioco, si legge il log:
; nessuna ricompilazione. Piano d'uso: docs/recon/probe_plan.md.
;
; [General]
;   Enabled=0|1        spento di default (utente finale: nessun effetto)
;   StartDelayMs       attesa prima di toccare il modulo (lasciare finire avvio e controlli)
;   IntervalMs         periodo di default dei campionamenti
;   AllowHooks=0|1     0 = sola lettura; le probe Instance=capture vengono saltate
;   MaxLogMB, SummarySec, LogSections
;   ExpectTimestamp    TimeDateStamp dell'exe per cui valgono le probe Rva= (altrimenti ignorate)
;
; [probe.<nome>]  un'ancora tra: Class= | ListClasses= | Signature= | Rva=
;   Class=pa::X oppure .?AVX@pa@@          (RTTI, robusto alle patch)
;   ListClasses=*Weather*                   elenca classi (nome, vtable, numero di slot)
;   Signature=48 8B ?? ...  SigOffset=  Resolve=none|call|jmp|rip:<offsetDisp>:<lunghezzaIstr>
;   SigSection=code|rdata|data  AllowMultiple=0|1
;   LogVtable=1 MaxSlots=64 LogHierarchy=1
;   Instance=none|scan|global|capture
;     scan     cerca nell'heap gli oggetti con quella vtable (sola lettura)
;     global   indirizzo da Signature/Rva, poi Chain=off1,off2 (p = *(p+off) per ogni elemento)
;     capture  Hook=vtable (Class+Slot) o Hook=minhook (funzione nella sezione di codice), registra
;              `this` (CaptureArg=rcx|rdx) e i chiamanti; richiede AllowHooks=1
;   MaxInstances, ScanMaxMB, RescanSec, CheckVtable
;   Dump=<offset>:<size>     dump periodico, nel log solo le dword cambiate
;   Watch=0x34:f32:nome, 0x31:u8   tipi u8 i8 u16 i16 u32 i32 u64 i64 f32 f64 ptr
;   Epsilon, IntervalMs, DurationSec (poi l'hook viene rimosso), Stats=1 StatsRanges=0:24, 0:1

[General]
Enabled=0
StartDelayMs=30000
IntervalMs=500
AllowHooks=0
MaxLogMB=64
SummarySec=30
LogSections=1
ExpectTimestamp=0x6AE387F2

; ---------------------------------------------------------------- inventario (sola lettura)
[probe.list_weather]
ListClasses=*Weather*

[probe.list_time]
ListClasses=*Time*

[probe.list_climate]
ListClasses=*Climate*

[probe.list_snow]
ListClasses=*Snow*

[probe.list_env]
ListClasses=*Environment*

; ---------------------------------------------------------------- orologio (sola lettura)
; GameTimeGlobals_ref (data/partial/signatures_2040_hotfix.json): copia B "default" del GameTime
; pubblicato (32 byte): +0 day, +4 hour, +8 minute, +0xC second, +0x10 ms, +0x16 rate, +0x18 stamp.
[probe.clock_b]
Signature=C5 FC 10 05 ?? ?? ?? ?? EB 08 C5 FC 10 05 ?? ?? ?? ?? 80 BB 7C 01 00 00
SigOffset=10
Resolve=rip:4:8
Instance=global
Dump=0:0x20
Watch=0x0:u32:day, 0x4:u32:hour, 0x8:u32:minute, 0x16:u16:rate
IntervalMs=1000

; copia A (usata quando il flag TLS e' attivo)
[probe.clock_a]
Signature=C5 FC 10 05 ?? ?? ?? ?? EB 08 C5 FC 10 05 ?? ?? ?? ?? 80 BB 7C 01 00 00
Resolve=rip:4:8
Instance=global
Watch=0x0:u32:day, 0x4:u32:hour, 0x8:u32:minute, 0x16:u16:rate
IntervalMs=1000

; ---------------------------------------------------------------- neve: cvar (sola lettura)
[probe.cvar_snow_start]
Signature=41 B8 7B 53 B3 20 48 8D 0D ?? ?? ?? ??
SigOffset=6
Resolve=rip:3:7
Instance=global
Watch=0x38:f32:value, 0x3C:f32:default
IntervalMs=5000

[probe.cvar_snow_full]
Signature=41 B8 14 0D C4 5F 48 8D 0D ?? ?? ?? ??
SigOffset=6
Resolve=rip:3:7
Instance=global
Watch=0x38:f32:value, 0x3C:f32:default
IntervalMs=5000

; ---------------------------------------------------------------- oggetti per RTTI (sola lettura)
[probe.server_weather]
Class=pa::ServerWeatherManager
LogVtable=1
LogHierarchy=1
Instance=scan
Dump=0:0x200
Stats=1
StatsRanges=0:24, 0:1, -60:60

[probe.weather_time_sim]
Class=pa::scriptComponent::weatherTimeSimulatorScriptComponent
LogVtable=1
LogHierarchy=1
Instance=scan
Dump=0:0x200
Stats=1
StatsRanges=0:24, 0:1

[probe.climate_texture]
Class=pa::PAClimateTexture
LogVtable=1
Instance=scan
Watch=0x18:ptr:texels, 0x20:u32:count, 0x30:f32:mPerTexel, 0x38:u32:w, 0x3C:u32:h

[probe.gametime_condition]
Class=pa::AICondition_CheckCurrentGameTime
LogVtable=1
MaxSlots=8

; ---------------------------------------------------------------- hook (AllowHooks=1 richiesto)
; WeatherManager_Update (sezione di codice, una sola corrispondenza): cattura `this` = PAWeatherManager
[probe.weather_manager]
Enabled=0
Signature=48 8B C4 53 55 56 57 41 54 41 56 41 57 48 81 EC 90 00 00 00 C5 F8 29 70 B8 C5 F8 29 78 A8 C5 78
Instance=capture
Hook=minhook
MaxInstances=2
Dump=0x30:0x40
Stats=1
StatsRanges=-60:60, 0:1
Watch=0x31:u8:manual, 0x34:f32:climateTemp, 0x44:f32:currentTemp, 0x48:f32:humidity, 0x4C:f32:wind
DurationSec=600

; Giro meteo (30/10): istanze dei simulatori meteo, scansione a fette (B4)
[probe.weather_sim]
Class=pa::scriptComponent::WeatherSimulatorScriptComponent
LogVtable=1
Instance=scan
MaxInstances=2
Dump=0:0x200
Stats=1
StatsRanges=0:1, -60:60

[probe.weather_cloud]
Class=pa::scriptComponent::WeatherCloudSimulatorScriptComponent
Instance=scan
MaxInstances=2
Dump=0:0x200
Stats=1
StatsRanges=0:1

[probe.weather_surface]
Class=pa::scriptComponent::WeatherSurfaceSimulatorScriptComponent
Instance=scan
MaxInstances=2
Dump=0:0x200
Stats=1
StatsRanges=0:1

; ================================================================ funzioni finali (31/10)
; Blocchi composti dal gioco a ogni tick, presi dal modulo meteo (Provider=climate_manager, nessun
; hook in piu': serve solo che il meteo sia avviato, anche con [Weather] Enabled=0). Sola lettura.
; Uso e lettura del probe.log: docs/dev/probe_funzioni_finali.md. Instance=provided accetta Chain=
; (p = *(p+off) per ogni elemento), Dump, Watch, Stats come le altre probe.
;   Provider=climate_manager   l'oggetto climate manager visto dall'hook del meteo
[probe.layer_atmosphere]
Enabled=0
Provider=climate_manager
Instance=provided
Chain=0x60, 0x28
Dump=0:0x400
Stats=1
StatsRanges=0:1, -1:1, 0:24, 0:100000
Watch=0xAC:f32:cloudCover
IntervalMs=1000

; Seconda parte dell'atmosfera (se il blocco continua oltre 0x400): colori e intensità di sole,
; ambiente e cielo, densità della nebbia (docs/dev/luce.md). Righe Watch= da aggiungere a mano sui
; float candidati trovati nel Dump (es. Watch=0x1A0:f32:sunR, 0x1A4:f32:sunG, 0x1A8:f32:sunB).
[probe.layer_atmosphere_tail]
Enabled=0
Provider=climate_manager
Instance=provided
Chain=0x60, 0x28
Dump=0x400:0x400
Stats=1
StatsRanges=0:1, 0:10, 0:100000
IntervalMs=1000

[probe.layer_weather]
Enabled=0
Provider=climate_manager
Instance=provided
Chain=0x60, 0x20
Dump=0:0x400
Stats=1
StatsRanges=0:1, -1:1
Watch=0x12C:f32:precip, 0x130:f32:cloud, 0x16C:f32:snow, 0x170:f32:rain
IntervalMs=500

; La tabella dei livelli: i puntatori agli altri livelli (fulmini, effetti) stanno qui.
[probe.layer_table]
Enabled=0
Provider=climate_manager
Instance=provided
Chain=0x60
Dump=0:0x100
IntervalMs=2000

; Il climate manager stesso (primi 0x400 byte; l'ora del gioco si legge dalla riga Watch del meteo).
[probe.climate_manager]
Enabled=0
Provider=climate_manager
Instance=provided
Dump=0:0x400
IntervalMs=2000

