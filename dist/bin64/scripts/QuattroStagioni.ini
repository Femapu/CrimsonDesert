; QuattroStagioni - configurazione (la maggior parte delle opzioni si cambia anche dal menu in gioco: F5)
[General]
; 1 = attivo, 0 = nessun hook installato (il gioco gira come se il plugin non ci fosse)
Enabled=1
; 1 = sostituisce le texture (pacchetti stagionali), 0 = solo osservazione (hook + log, nessun byte modificato)
Substitute=1
; 0 = solo errori, 1 = info (consigliato), 2 = debug (ogni lettura .paz, fino a MaxReadLogLines righe), 3 = trace
LogLevel=1
MaxReadLogLines=3000
; 1 = una lettura asincrona che tocca il range bersaglio viene completata e corretta dentro ReadFile
WaitForTargetReads=1
; riepilogo periodico nel log (secondi)
SummaryIntervalSeconds=30
; lingua dell'interfaccia: auto = come il gioco (impostazione di Steam), oppure it, en, ...
Language=auto

[Packs]
; Pacchetti stagionali creati da qs_gen sul tuo PC (vedi docs/GENERATORE.md).
; Il plugin sceglie da solo il pacchetto dello stadio corrente del calendario; Active serve solo
; per forzarne uno all'avvio (es. A, W, A>W.2). Vuoto = automatico. Il pacchetto forzato vale finché il
; calendario non cambia stadio o finché non scegli una stagione dal menu F5 (e "Salva" svuota Active).
Active=
; cartella dei pacchetti, relativa a bin64\scripts (o percorso assoluto)
Folder=QuattroStagioni\packs
; memoria massima per i dati in cache (MB)
CacheMB=64

[Snow]
; Neve d'inverno: soglie di temperatura del gioco (SnowStart, SnowFull).
; Il gioco mostra neve dove la temperatura del clima è <= SnowStart, copertura piena a <= SnowFull
; (vanilla -5 e -20: in pratica mai). In inverno la mod alza le soglie gradualmente, fuori
; dall'inverno tornano esattamente ai valori originali. Il deserto resta senza neve perché la sua
; temperatura è molto più alta di qualunque soglia ammessa (MaxSnowStart).
; Si spegne anche dal menu F5 (Meteo e luce, "Neve che si accumula").
; Tutte le chiavi sono facoltative: se mancano valgono questi default.
Enabled=1
WinterSnowStart=10.0
WinterSnowFull=0.0
; limite di sicurezza per WinterSnowStart (massimo assoluto 10)
MaxSnowStart=10.0
; variazione massima in gradi al secondo reale
MaxRate=0.5
StartDelayMs=20000

[Weather]
; Meteo stagionale: la mod sceglie a turni ("periodi") il tempo della stagione sull'orologio del
; gioco (dormire o aspettare lo fa avanzare) e lo sovrappone al meteo del gioco con passaggi graduali.
; Nel deserto il meteo resta sempre quello del gioco. Si spegne anche dal menu F5 ("Meteo stagionale").
; Tutte le chiavi sono facoltative: se mancano valgono questi default.
Enabled=1
; variazione per ora di gioco (1.5 = passaggio completo in circa 40 minuti di gioco)
RampPerHour=1.5
; copertura nuvolosa massima con il sereno (0..1; il gioco di solito circa 0.45)
ClearCover=0.25
; deserto: temperatura massima del giorno (mappa del clima) da cui una zona conta come deserto
DesertTopTempC=28
; texel (80 m) intorno alla telecamera controllati per il deserto
DesertRadius=4
; secondi reali per restituire il cielo al gioco entrando nel deserto
DesertFadeSec=3
; 1 = fuori dall'inverno resta la neve del gioco (montagne innevate); 0 = nessuna neve fuori dall'inverno
KeepGameSnow=1
; ogni quanti secondi reali scrivere nel log i valori composti (0 = mai)
LogIntervalSec=60
StartDelayMs=20000
; Per fase (Spring, Summer, LateSummer, Autumn, Winter):
;   Weights    pesi relativi del prossimo periodo: gioco, sereno, nuvoloso, coperto, pioggia, temporale
;              (d'inverno pioggia = neve, temporale = bufera di neve)
;   Hours      durata di un periodo in ore di gioco (min, max); StormHours per i temporali
;   Rain       intensità della pioggia o neve (min, max, 0..1); StormMin intensità minima del temporale
;   GameRain   quota della pioggia del gioco che resta (0..1; d'inverno diventa neve)
; I temporali sono pioggia fortissima con cielo chiuso; i fulmini li regola la sezione [Lightning].
; primavera: soleggiata, poca pioggia, temporali rari
Spring.Weights=15, 50, 22, 0, 10, 3
Spring.Hours=3, 8
Spring.StormHours=1, 2.5
Spring.Rain=0.25, 0.55
Spring.StormMin=0.85
Spring.GameRain=0.5
; estate: poca pioggia ma temporali estivi
Summer.Weights=15, 58, 12, 0, 5, 10
Summer.Hours=2, 6
Summer.StormHours=1, 2.5
Summer.Rain=0.2, 0.5
Summer.StormMin=0.85
Summer.GameRain=0.25
; fine estate: poca pioggia, qualche temporale
LateSummer.Weights=15, 50, 20, 0, 8, 7
LateSummer.Hours=3, 7
LateSummer.StormHours=1, 3
LateSummer.Rain=0.25, 0.6
LateSummer.StormMin=0.85
LateSummer.GameRain=0.35
; autunno: pioggia e temporali frequenti, più nuvole
Autumn.Weights=10, 15, 22, 13, 25, 15
Autumn.Hours=3, 9
Autumn.StormHours=1.5, 4
Autumn.Rain=0.4, 0.9
Autumn.StormMin=0.85
Autumn.GameRain=1
; inverno: cielo coperto o nuvoloso, neve frequente, mai sereno a lungo
Winter.Weights=0, 5, 25, 37, 28, 5
Winter.Hours=4, 10
Winter.StormHours=2, 5
Winter.Rain=0.45, 1
Winter.StormMin=0.85
Winter.GameRain=1

[Lightning]
; Fulmini nei temporali, secondo la stagione. A ogni nuovo temporale (della mod o del gioco) la mod
; decide se avrà fulmini (ChancePerStorm); durante il temporale i lampi arrivano a caso (in media
; StrikesPerHour per ora di gioco, per l'intensità del temporale). Mai nel deserto. Il tuono resta
; quello del gioco. Si spegne anche dal menu F5 ("Fulmini", scheda Meteo e luce).
; Il campo del gioco da scrivere si imposta in QuattroStagioni\targets.ini, sezione [lightning]:
; finché non è impostato la mod scrive solo le righe "lightning: strike" nel log.
; Tutte le chiavi sono facoltative: se mancano valgono questi default.
Enabled=1
; quota dei temporali con fulmini per fase: primavera, estate, fine estate, autunno, inverno (0..1)
ChancePerStorm=0.6, 0.9, 0.85, 0.85, 0.03
; lampi per ora di gioco a temporale pieno, per fase (stesso ordine)
StrikesPerHour=8, 14, 12, 12, 1
; secondi reali minimi tra due lampi
MinGapSec=3
; durata del lampo in millisecondi reali
PulseMs=250
; secondi reali per portare il livello dei fulmini da 0 a 1 (inizio e fine del temporale)
RampSec=6
; 1 = una riga nel log per ogni lampo (sempre attiva finché il campo non è impostato)
LogStrikes=0

[Lighting]
; Luce e cielo stagionali: moltiplicano i valori del gioco (sole, luce ambiente, nebbia, colore del
; cielo). 1 = valore del gioco; l'estate resta quella originale. I valori seguono lo stadio visivo
; della regione temperata, compresi i passaggi graduali tra le stagioni (come le foglie). Nel
; deserto la luce resta sempre quella del gioco. Si spegne anche dal menu F5 ("Luce stagionale").
; Serve che i campi della luce siano indicati in QuattroStagioni\targets.ini, sezione [lighting]
; (trovati con le probe): finché non lo sono questa sezione non ha effetto.
; Tutte le chiavi sono facoltative: se mancano valgono questi default.
Enabled=1
; variazione massima dei moltiplicatori per secondo reale (0.01 = un cambio di 0.05 in 5 secondi)
RampPerSec=0.01
; ogni quanti secondi reali scrivere nel log i moltiplicatori (0 = mai)
LogIntervalSec=60
; Cinque valori per chiave, nell'ordine: primavera, estate, fine estate, autunno, inverno.
; Colori e intensità 0.5 .. 1.5, nebbia 0.5 .. 2. Restare vicini a 1 (0.85 .. 1.1): il gioco
; ha già il suo ciclo del giorno, qui si sposta solo un poco il tono della stagione.
; inverno sole più debole e freddo, autunno caldo e dorato, primavera appena fresca,
; fine estate calda e un po' velata
; intensità del sole
SunIntensity=0.97, 1, 1.02, 0.95, 0.88
; colore del sole: rosso
SunColorR=0.98, 1, 1.03, 1.05, 0.94
; colore del sole: verde
SunColorG=1, 1, 1, 0.98, 0.98
; colore del sole: blu
SunColorB=1.02, 1, 0.95, 0.88, 1.06
; intensità della luce ambiente
AmbientIntensity=0.98, 1, 1, 0.96, 0.92
; luce ambiente: rosso
AmbientR=0.98, 1, 1.02, 1.04, 0.95
; luce ambiente: verde
AmbientG=1, 1, 1, 0.99, 0.98
; luce ambiente: blu
AmbientB=1.02, 1, 0.97, 0.92, 1.05
; densità della nebbia (sopra 1 più velato)
FogDensity=1.05, 1, 1.08, 1.1, 1.1
; colore del cielo: rosso
SkyR=0.98, 1, 1.02, 1.03, 0.94
; colore del cielo: verde
SkyG=1, 1, 1, 0.99, 0.97
; colore del cielo: blu
SkyB=1.02, 1, 0.96, 0.94, 1.03

[DayLength]
; Durata del giorno: alba e tramonto seguono la stagione (giorni lunghi d'estate, corti d'inverno)
; SENZA cambiare la velocità dell'orologio del gioco. La mod sposta solo il sole: all'ora h del gioco
; mostra il sole che il gioco avrebbe a un'altra ora. Serve il campo del sole in targets.ini
; (sezione [daylength], guida docs/dev/durata_giorno.md); finché manca, il log riporta solo gli orari.
; Si spegne anche dal menu F5 ("Durata del giorno"). Tutte le chiavi sono facoltative.
Enabled=1
; alba e tramonto visibili del gioco senza mod (ore di gioco, da verificare in gioco)
GameSunrise=5.5
GameSunset=19.5
; spostamento in ore per fase (primavera, estate, fine estate, autunno, inverno):
; alba positiva = più tardi, tramonto negativo = più presto
SunriseShift=0.5, 0, 0.3, 1, 1.75
SunsetShift=-0.5, 0, -0.3, -1, -1.75
; durata minima del giorno stagionale in ore
MinDaylightHours=8
; variazione massima di alba e tramonto per ora di gioco (passaggi graduali, anche spegnendo dal menu)
RampPerHour=0.5
; tabella del sole imparata dal gioco: buchi colmati (in fasce da 15 minuti) e letture minime per fascia
MaxGapBins=2
MinSamples=4
; ogni quanti secondi reali salvare la tabella e scrivere lo stato nel log (0 = mai)
SaveIntervalSec=180
LogIntervalSec=120
StartDelayMs=25000

[Particles]
; Particelle stagionali: fiocchi di neve più fitti d'inverno, foglie che cadono in autunno,
; pollini e petali in primavera. Si spegne anche dal menu F5 ("Particelle").
; Tutte le chiavi sono facoltative: se mancano valgono questi default.
Enabled=1
; 1 = d'inverno, quando nevica già, la neve cade più fitta (mai neve dal nulla, mai nel deserto)
WinterFlakes=1
; moltiplicatore della neve che sta già cadendo (1..3)
WinterFlakeBoost=1.25
; neve minima mentre nevica e c'è precipitazione (0..1)
WinterFlakeMin=0.35
; sotto questo valore di neve il gioco non sta nevicando: la neve resta com'è (0.001..1)
SnowMinActive=0.05
; intensità delle foglie per fase (Spring, Summer, LateSummer, Autumn, Winter; 0..1).
; Se manca si usa il calendario delle stagioni (foglie della regione temperata).
; LeavesPerPhase=0, 0.05, 0.35, 1, 0.1
; intensità di pollini e petali per fase (0..1)
PollenPerPhase=1, 0.25, 0, 0, 0
; variazione massima delle intensità per secondo reale (0 = subito)
RampPerSec=0.2
; Foglie e pollini hanno bisogno di un campo del gioco non ancora trovato: si attivano in
; QuattroStagioni\targets.ini, sezione [particles] (vedi docs/dev/particelle.md).

; ============================================================================
; QuattroStagioni: calendario delle stagioni
; Si modifica anche dal menu in gioco (F5). Decimali con il punto (0.4), la
; virgola (0,4) è accettata. I valori fuori intervallo vengono corretti e
; segnalati nel file di log.
; ============================================================================
[Climate]
; Temperature stagionali: la mod sposta la temperatura massima del giorno nella mappa del clima
; del gioco (in memoria, dal vivo; i file del gioco non cambiano). Ogni chiave è facoltativa.
Enabled=1
; Gradi rispetto al gioco per fase (estate del gioco = riferimento). Nelle code di transizione
; il valore sfuma verso la fase successiva.
SpringOffsetC=-6
SummerOffsetC=4
LateSummerOffsetC=2
AutumnOffsetC=-8
WinterOffsetC=-24
; Nessuna stagione rende una notte più fredda di così dove le notti del gioco sono più miti
; (il freddo sotto circa -40 ferisce). I luoghi freddi del gioco (montagne innevate) restano come sono.
NightFloorC=-30
; Deserto: texel con massima >= DesertTopTempC; entro DesertRadius texel (80 m) restano come nel
; gioco in ogni stagione, poi la differenza stagionale entra in DesertFade texel.
DesertTopTempC=28
DesertRadius=4
DesertFade=4
; Gradi al secondo reale con cui la differenza in vigore insegue quella della stagione.
MaxRate=0.5
StartDelayMs=25000
LogIntervalSec=60

[Seasons]
; Durata di ogni stagione in giorni di gioco (0.5 .. 120). Il ciclo è:
; Primavera -> Estate -> Fine estate (secca) -> Autunno -> Inverno -> Primavera.
; L'estate è il gioco originale, senza modifiche.
SpringDays = 8
SummerDays = 8
LateSummerDays = 5
AutumnDays = 8
WinterDays = 9
; Parte finale di ogni stagione dedicata al passaggio alla successiva (0 .. 1).
; 0.4 = nell'ultimo 40% della stagione il paesaggio cambia verso la prossima.
TransitionFraction = 0.4
; Stadi intermedi di ogni passaggio (0 .. 8; 0 = cambio netto). Più stadi danno
; un cambio più graduale ma richiedono più spazio su disco per i pacchetti.
TransitionSteps = 3
; Varietà: ogni pianta anticipa o ritarda il proprio cambio fino a questi giorni
; (0 .. 10), così un bosco non cambia colore tutto insieme.
AssetJitterDays = 2
; Come avanza il calendario:
;   playtime  = tempo di gioco reale (vedi RealMinutesPerDay)
;   gameclock = segue l'orologio del gioco (quando agganciato)
;   manual    = fermo, il giorno si sceglie dal menu F5
DaySource = playtime
; Minuti reali per un giorno del calendario, con DaySource = playtime (1 .. 1440).
; Un giorno del gioco dura circa 60-120 minuti reali: 90 tiene il calendario
; vicino all'orologio del gioco.
RealMinutesPerDay = 90
; Giorno di partenza (0 = primo giorno di primavera). Con la durata predefinita:
; primavera 0, estate 8, fine estate 16, autunno 21, inverno 29; anno di 38 giorni.
StartDay = 0
; Interruttori (1 = attivo, 0 = spento).
WeatherControl = 1           ; meteo coerente con la stagione
SnowAccumulation = 1         ; neve che si accumula e si scioglie
LightControl = 1             ; luce e altezza del sole per stagione
DayLengthControl = 1         ; giornate più corte in inverno
Particles = 1                ; foglie che cadono, fiato visibile
ClimateControl = 1           ; temperature stagionali nella mappa del clima
LightningControl = 1         ; fulmini nei temporali, per stagione
; Velocità della neve, frazione di copertura per ora di gioco (0 .. 5).
SnowAccumPerHour = 0.25      ; quando nevica sotto zero
SnowMeltPerHour = 0.15       ; a +3 gradi (più veloce se fa più caldo)
; Le temperature non scendono mai sotto i -30 gradi (il gioco infligge danni da freddo).
; Latitudine virtuale in gradi (0 .. 65): più alta = inverni più bui, sole più basso.
VirtualLatitude = 45
; Finestra del giorno del gioco originale (l'estate): l'orologio del gioco ha una
; velocità per il giorno (03:00-18:59) e una per la notte. In inverno la mod accelera
; il giorno e rallenta la notte, così le ore di luce si accorciano (mai sotto 4).
VanillaSunrise = 3
VanillaSunset = 19
; Sotto questa temperatura (gradi C) il fiato diventa visibile.
BreathThreshold = 5

; ============================================================================
; Regioni
;   Enabled         0 = la regione resta sempre come in estate (gioco originale)
;   DayOffset       sposta il calendario della regione in giorni (negativo = in anticipo)
;   <Stagione>Scale allunga (>1) o accorcia (<1) una stagione (0.1 .. 5); l'anno resta
;                   della stessa lunghezza, le altre stagioni si adattano
;   MeanTemp        temperatura media annua (gradi C)
;   TempAmplitude   differenza tra la media e il cuore dell'inverno o dell'estate
;   DailyAmplitude  metà dell'escursione tra giorno e notte
;   Humidity        0 secco .. 1 molto umido (più pioggia e nuvole)
;   Leaves          intensità delle foglie che cadono in autunno (0 .. 2)
; ============================================================================

[Region.Temperate]
; Zone temperate: ciclo completo delle stagioni.
Enabled = 1
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 10
TempAmplitude = 14
DailyAmplitude = 4
Humidity = 0.5
Leaves = 1

[Region.NorthCold]
; Nord freddo: inverno anticipato e più lungo, estate breve, molta neve.
Enabled = 1
DayOffset = -3
SpringScale = 1
SummerScale = 0.7
LateSummerScale = 0.8
AutumnScale = 1
WinterScale = 1.5
MeanTemp = 1
TempAmplitude = 14
DailyAmplitude = 3.5
Humidity = 0.55
Leaves = 0.6

[Region.SwampJungle]
; Paludi e giungla: sempreverdi, umide, non gela mai.
Enabled = 1
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 22
TempAmplitude = 5
DailyAmplitude = 3
Humidity = 0.85
Leaves = 0.2

[Region.Aquatic]
; Piante acquatiche: variazioni leggere.
Enabled = 1
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 12
TempAmplitude = 11
DailyAmplitude = 2.5
Humidity = 0.7
Leaves = 0.3

[Region.DesertDry]
; Deserto: escluso per scelta (sempre come il gioco originale).
Enabled = 0
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 27
TempAmplitude = 10
DailyAmplitude = 9
Humidity = 0.05
Leaves = 0

[Region.Abyss]
; Abisso: escluso per scelta (sempre come il gioco originale).
Enabled = 0
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 15
TempAmplitude = 0
DailyAmplitude = 0
Humidity = 0.3
Leaves = 0

[GpuSwap]
; Cambio delle texture già caricate in memoria video quando cambia lo stadio stagionale (calendario o
; menu F5), senza ricaricare. Senza questo modulo le texture già visibili cambiano solo dopo un
; viaggio rapido o un caricamento. Build di prova: acceso per default (il default della versione
; pubblica potrebbe diventare 0). A qualunque errore D3D12 si spegne da solo per la sessione
; (riga "gpu: DISABLED: <motivo>" nel log) e il gioco continua come prima.
; Tutte le chiavi sono facoltative: se mancano valgono questi default.
Enabled=1
; dati caricati al massimo per frame presentato (MB, da 0.25 a 64); un mip più grande va da solo
MaxMBPerFrame=4
; 0 = solo errori, 1 = riepiloghi (al massimo ogni 30 s), 2 = una riga per ogni lotto caricato
LogLevel=1
