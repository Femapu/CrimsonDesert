; QuattroStagioni - configurazione (la maggior parte delle opzioni si cambia anche dal menu in gioco: F5)
[General]
; 1 = attivo, 0 = nessun hook installato (il gioco gira come se il plugin non ci fosse)
Enabled=1
; 1 = sostituisce le texture (pacchetti stagionali), 0 = solo osservazione (hook + log, nessun byte modificato)
Substitute=1
; 0 = solo errori, 1 = info (consigliato), 2 = debug (ogni lettura .paz, fino a MaxReadLogLines righe), 3 = trace
LogLevel=1
MaxReadLogLines=3000
; 1 = una lettura asincrona che tocca il range bersaglio viene completata e corretta dentro ReadFile
WaitForTargetReads=1
; riepilogo periodico nel log (secondi)
SummaryIntervalSeconds=30
; lingua dell'interfaccia: auto = come il gioco (impostazione di Steam), oppure it, en, ...
Language=auto

[Packs]
; Pacchetti stagionali creati da qs_gen sul tuo PC (vedi docs/GENERATORE.md).
; Il plugin sceglie da solo il pacchetto dello stadio corrente del calendario; Active serve solo
; per forzarne uno all'avvio (es. A, W, A>W.2). Vuoto = automatico.
Active=
; cartella dei pacchetti, relativa a bin64\scripts (o percorso assoluto)
Folder=QuattroStagioni\packs
; memoria massima per i dati in cache (MB)
CacheMB=64

; ============================================================================
; QuattroStagioni: calendario delle stagioni
; Si modifica anche dal menu in gioco (F5). Decimali con il punto (0.4), la
; virgola (0,4) è accettata. I valori fuori intervallo vengono corretti e
; segnalati nel file di log.
; ============================================================================
[Seasons]
; Durata di ogni stagione in giorni di gioco (0.5 .. 120). Il ciclo è:
; Primavera -> Estate -> Fine estate (secca) -> Autunno -> Inverno -> Primavera.
; L'estate è il gioco originale, senza modifiche.
SpringDays = 8
SummerDays = 8
LateSummerDays = 5
AutumnDays = 8
WinterDays = 9
; Parte finale di ogni stagione dedicata al passaggio alla successiva (0 .. 1).
; 0.4 = nell'ultimo 40% della stagione il paesaggio cambia verso la prossima.
TransitionFraction = 0.4
; Stadi intermedi di ogni passaggio (0 .. 8; 0 = cambio netto). Più stadi danno
; un cambio più graduale ma richiedono più spazio su disco per i pacchetti.
TransitionSteps = 3
; Varietà: ogni pianta anticipa o ritarda il proprio cambio fino a questi giorni
; (0 .. 10), così un bosco non cambia colore tutto insieme.
AssetJitterDays = 2
; Come avanza il calendario:
;   playtime  = tempo di gioco reale (vedi RealMinutesPerDay)
;   gameclock = segue l'orologio del gioco (quando agganciato)
;   manual    = fermo, il giorno si sceglie dal menu F5
DaySource = playtime
; Minuti reali per un giorno del calendario, con DaySource = playtime (1 .. 1440).
; Un giorno del gioco dura circa 60-120 minuti reali: 90 tiene il calendario
; vicino all'orologio del gioco.
RealMinutesPerDay = 90
; Giorno di partenza (0 = primo giorno di primavera). Con la durata predefinita:
; primavera 0, estate 8, fine estate 16, autunno 21, inverno 29; anno di 38 giorni.
StartDay = 0
; Interruttori (1 = attivo, 0 = spento).
WeatherControl = 1           ; meteo coerente con la stagione
SnowAccumulation = 1         ; neve che si accumula e si scioglie
LightControl = 1             ; luce e altezza del sole per stagione
DayLengthControl = 1         ; giornate più corte in inverno
Particles = 1                ; foglie che cadono, fiato visibile
; Velocità della neve, frazione di copertura per ora di gioco (0 .. 5).
SnowAccumPerHour = 0.25      ; quando nevica sotto zero
SnowMeltPerHour = 0.15       ; a +3 gradi (più veloce se fa più caldo)
; Le temperature non scendono mai sotto i -30 gradi (il gioco infligge danni da freddo).
; Latitudine virtuale in gradi (0 .. 65): più alta = inverni più bui, sole più basso.
VirtualLatitude = 45
; Finestra del giorno del gioco originale (l'estate): l'orologio del gioco ha una
; velocità per il giorno (03:00-18:59) e una per la notte. In inverno la mod accelera
; il giorno e rallenta la notte, così le ore di luce si accorciano (mai sotto 4).
VanillaSunrise = 3
VanillaSunset = 19
; Sotto questa temperatura (gradi C) il fiato diventa visibile.
BreathThreshold = 5

; ============================================================================
; Regioni
;   Enabled         0 = la regione resta sempre come in estate (gioco originale)
;   DayOffset       sposta il calendario della regione in giorni (negativo = in anticipo)
;   <Stagione>Scale allunga (>1) o accorcia (<1) una stagione (0.1 .. 5); l'anno resta
;                   della stessa lunghezza, le altre stagioni si adattano
;   MeanTemp        temperatura media annua (gradi C)
;   TempAmplitude   differenza tra la media e il cuore dell'inverno o dell'estate
;   DailyAmplitude  metà dell'escursione tra giorno e notte
;   Humidity        0 secco .. 1 molto umido (più pioggia e nuvole)
;   Leaves          intensità delle foglie che cadono in autunno (0 .. 2)
; ============================================================================

[Region.Temperate]
; Zone temperate: ciclo completo delle stagioni.
Enabled = 1
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 10
TempAmplitude = 14
DailyAmplitude = 4
Humidity = 0.5
Leaves = 1

[Region.NorthCold]
; Nord freddo: inverno anticipato e più lungo, estate breve, molta neve.
Enabled = 1
DayOffset = -3
SpringScale = 1
SummerScale = 0.7
LateSummerScale = 0.8
AutumnScale = 1
WinterScale = 1.5
MeanTemp = 1
TempAmplitude = 14
DailyAmplitude = 3.5
Humidity = 0.55
Leaves = 0.6

[Region.SwampJungle]
; Paludi e giungla: sempreverdi, umide, non gela mai.
Enabled = 1
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 22
TempAmplitude = 5
DailyAmplitude = 3
Humidity = 0.85
Leaves = 0.2

[Region.Aquatic]
; Piante acquatiche: variazioni leggere.
Enabled = 1
DayOffset = 0
SpringScale = 1
SummerScale = 1
LateSummerScale = 1
AutumnScale = 1
WinterScale = 1
MeanTemp = 12
TempAmplitude = 11
DailyAmplitude = 2.5
Humidity = 0.7
Leaves = 0.3

[Region.DesertDry]
