; QuattroStagioni (fase 2) - configurazione
[General]
; 1 = attivo, 0 = nessun hook installato (il gioco gira come se il plugin non ci fosse)
Enabled=1
; 1 = sostituisce la texture di test, 0 = solo osservazione (hook + log, nessun byte modificato)
Substitute=1
; 0 = solo errori, 1 = info (consigliato), 2 = debug (ogni lettura .paz, fino a MaxReadLogLines righe), 3 = trace
LogLevel=1
MaxReadLogLines=3000
; 1 = una lettura asincrona che tocca il range bersaglio viene completata e corretta dentro ReadFile
WaitForTargetReads=1
; riepilogo periodico nel log (secondi)
SummaryIntervalSeconds=30
