# Builds the plugin, the Windows tools and runs the unit tests on every push.
# The artifact "QuattroStagioni-dist" holds a ready-to-copy bin64 folder (no game data inside).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64
      - name: Build and test
        run: ./build.sh test
      - name: Assemble dist
        run: |
          rm -rf out && mkdir -p out
          cp -r dist/bin64 out/bin64
          cp build/QuattroStagioni.asi out/bin64/scripts/
          mkdir -p out/tools
          cp build/win/*.exe out/tools/ 2>/dev/null || true
          cp -r data/recipes out/tools/recipes 2>/dev/null || true
          cp data/vegetation_classes_v1.json out/tools/ 2>/dev/null || true
          cp THIRD_PARTY.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: QuattroStagioni-dist
          path: out/
          retention-days: 30
