; QuattroStagioni - ricette stagionali (dati nostri, nessun dato del gioco).
;
; Ogni pixel viene trasformato nello spazio colore OKLCh (L luminosita 0..1, C croma, h tinta in gradi)
; con tre maschere morbide calcolate dal colore originale:
;   green = tinte da fogliame (verde giallo .. verde blu) con croma sufficiente: foglie, erba, aghi
;   petal = colori saturi non verdi: petali, bacche
;   other = tutto il resto: corteccia, rami, terra, grigi e marroni (quasi intatti di default)
;
; Sezioni:
;   [masks]                  soglie delle maschere
;   [palette]                nome = tinta, moltiplicatore croma, moltiplicatore luminosita
;   [<profilo>]              inherit = altro profilo, strength = 0..1 (scala gli effetti ereditati),
;                            mode = color | channels, description = testo libero
;   [<profilo>.<look>]       look: S primavera, L fine estate, A autunno, W inverno (U estate = gioco originale)
;
; Chiavi di una look:
;   palette = nome[:peso], ...   tinta obiettivo; con piu voci il seme dell'asset ne sceglie una
;   <gruppo>.hue_amount  0..1    quanto la tinta si sposta verso l'obiettivo (gruppo: green, petal, other)
;   <gruppo>.target              colore della palette per quel gruppo (altrimenti quello della look)
;   <gruppo>.spread              quota della variazione di tinta originale conservata (solo green)
;   <gruppo>.hue_shift           gradi aggiunti alla tinta
;   <gruppo>.chroma, .light      moltiplicatori di croma e luminosita
;   <gruppo>.light_add, .contrast  luminosita additiva, contrasto attorno a L = 0.5
;   <gruppo>.drop        0..1    quota di pixel che diventano trasparenti (caduta foglie), a chiazze
;   lum_hue                      gradi di tinta per unita di L: le parti scure virano verso il rosso
;   jitter_hue, jitter_amount    variazione per asset (seme) della tinta e dell'intensita
;   tint_a, tint_b               spostamento globale in OKLab (tint_b negativo = piu freddo)
;   frost                        velo di brina (verso un bianco azzurrato)
;   drop_cells, drop_soft        dimensione delle chiazze di caduta (celle per lato) e morbidezza
;   r_offset, g_offset, b_offset solo mode = channels: somma ai canali (0..255)
; Le transizioni interpolano questi PARAMETRI tra due look, non i pixel.

[masks]
green_hue_min = 108
green_hue_max = 172
green_hue_soft = 16
green_chroma_min = 0.018
green_chroma_soft = 0.03
petal_chroma_min = 0.07
petal_chroma_soft = 0.05

