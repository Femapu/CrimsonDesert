; probes.ini used by tests/probe_fake/run.sh against the fake game (not shipped)
[General]
Enabled=1
StartDelayMs=300
IntervalMs=50
AllowHooks=1
SummarySec=1

[probe.list]
ListClasses=pa::*

[probe.weather_scan]
Class=pa::PAWeatherManager
LogVtable=1
LogHierarchy=1
Instance=scan
Dump=0x30:0x20
Stats=1
StatsRanges=0:1, -20:20
Watch=0x48:f32:snow, 0x44:f32:curTemp
Epsilon=0.05

[probe.tod_capture]
Class=pa::TimeOfDay
Instance=capture
Slot=1
Watch=0x8:f32:hour, 0xC:u32:day, 0x10:f64:total
Epsilon=1

[probe.weather_fn]
Signature=48 B8 11 0A A5 5E DE C0 AD 0B
Instance=capture
Hook=minhook
Watch=0x4C:f32:accum
Epsilon=20
DurationSec=2

[probe.clock]
Signature=48 B8 88 77 66 55 44 33 22 11 48 8D 05 ?? ?? ?? ??
SigOffset=10
Resolve=rip:3:7
Instance=global
Dump=0:0x20
Watch=0x4:u32:hour
IntervalMs=200

[probe.world_chain]
Signature=48 B8 00 FF EE DD CC BB AA 99 48 8B 05 ?? ?? ?? ??
SigOffset=10
Resolve=rip:3:7
Instance=global
Chain=0x0, 0x60
Watch=0x48:f32:snow
Epsilon=0.1

[probe.sim]
Class=pa::scriptComponent::weatherTimeSimulatorScriptComponent
LogHierarchy=1
LogVtable=1

[probe.missing]
Class=pa::DoesNotExist

[probe.ambiguous]
Signature=CC CC

[probe.badconfig]
Class=pa::TimeOfDay
Instance=capture
